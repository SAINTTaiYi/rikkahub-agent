name: Build Long-Running Agent APK

on:
  push:
    branches: [build/unlimited-agent-steps]
    paths: [.github/workflows/build-unlimited-agent.yml]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: long-agent-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: build/unlimited-agent-steps
          fetch-depth: 0
          persist-credentials: false
          submodules: recursive

      - name: Apply long-running limits, standalone ID, and Ultra thinking
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          changes = [
              (
                  Path("app/src/main/java/me/rerere/rikkahub/service/ChatService.kt"),
                  r"(?m)^(\s*maxSteps\s*=\s*subAgentProfile\?\.generationMaxSteps\(\)\s*\?:\s*)32,\s*$",
                  r"\g<1>Int.MAX_VALUE,",
                  r"(?m)^\s*maxSteps\s*=\s*subAgentProfile\?\.generationMaxSteps\(\)\s*\?:\s*Int\.MAX_VALUE,\s*$",
              ),
              (
                  Path("app/src/main/java/me/rerere/rikkahub/data/preferences/TermuxDefaults.kt"),
                  r"(?m)^(\s*const val DEFAULT_TURN_BUDGET_MS\s*=\s*)10L\s*\*\s*60L\s*\*\s*1_000L.*$",
                  r"\g<1>4L * 60L * 60L * 1_000L // 4 h",
                  r"(?m)^\s*const val DEFAULT_TURN_BUDGET_MS\s*=\s*4L\s*\*\s*60L\s*\*\s*60L\s*\*\s*1_000L.*$",
              ),
              (
                  Path("app/src/main/java/me/rerere/rikkahub/data/preferences/TermuxDefaults.kt"),
                  r"(?m)^(\s*const val MAX_TURN_BUDGET_MS\s*=\s*)60L\s*\*\s*60L\s*\*\s*1_000L.*$",
                  r"\g<1>8L * 60L * 60L * 1_000L // 8 h",
                  r"(?m)^\s*const val MAX_TURN_BUDGET_MS\s*=\s*8L\s*\*\s*60L\s*\*\s*60L\s*\*\s*1_000L.*$",
              ),
              (
                  Path("app/build.gradle.kts"),
                  r"(?m)^(\s*applicationId\s*=\s*)\"me\.rerere\.rikkahub\"\s*$",
                  r"\g<1>\"me.rerere.rikkahub.longagent\"",
                  r"(?m)^\s*applicationId\s*=\s*\"me\.rerere\.rikkahub\.longagent\"\s*$",
              ),
              (
                  Path("ai/src/main/java/me/rerere/ai/core/Reasoning.kt"),
                  r"(?m)^(\s*XHIGH\()16_000(,\s*\"xhigh\"\);\s*)$",
                  r"\g<1>64_000\g<2>",
                  r"(?m)^\s*XHIGH\(64_000,\s*\"xhigh\"\);\s*$",
              ),
              (
                  Path("app/src/main/res/values/strings.xml"),
                  r"<string name=\"reasoning_xhigh\">XHigh</string>",
                  r"<string name=\"reasoning_xhigh\">Ultra</string>",
                  r"<string name=\"reasoning_xhigh\">Ultra</string>",
              ),
              (
                  Path("app/src/main/res/values-zh/strings.xml"),
                  r"<string name=\"reasoning_xhigh\">超高</string>",
                  r"<string name=\"reasoning_xhigh\">极限</string>",
                  r"<string name=\"reasoning_xhigh\">极限</string>",
              ),
              (
                  Path("app/src/main/res/values-zh-rTW/strings.xml"),
                  r"<string name=\"reasoning_xhigh\">超高</string>",
                  r"<string name=\"reasoning_xhigh\">極限</string>",
                  r"<string name=\"reasoning_xhigh\">極限</string>",
              ),
          ]
          for path, old, new, already in changes:
              text = path.read_text()
              updated, count = re.subn(old, new, text)
              if count == 1:
                  path.write_text(updated)
              elif count == 0 and re.search(already, text):
                  continue
              else:
                  raise SystemExit(f"Could not patch {path}: matches={count}")
          PY
          grep -E "generationMaxSteps\(\).*Int\.MAX_VALUE" app/src/main/java/me/rerere/rikkahub/service/ChatService.kt
          grep -E "DEFAULT_TURN_BUDGET_MS.*4L \* 60L \* 60L" app/src/main/java/me/rerere/rikkahub/data/preferences/TermuxDefaults.kt
          grep -E "MAX_TURN_BUDGET_MS.*8L \* 60L \* 60L" app/src/main/java/me/rerere/rikkahub/data/preferences/TermuxDefaults.kt
          grep -E "applicationId.*rikkahub\.longagent" app/build.gradle.kts
          grep -E "XHIGH\(64_000.*xhigh" ai/src/main/java/me/rerere/ai/core/Reasoning.kt

      - name: Persist requested source changes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/me/rerere/rikkahub/service/ChatService.kt app/src/main/java/me/rerere/rikkahub/data/preferences/TermuxDefaults.kt app/build.gradle.kts ai/src/main/java/me/rerere/ai/core/Reasoning.kt app/src/main/res/values/strings.xml app/src/main/res/values-zh/strings.xml app/src/main/res/values-zh-rTW/strings.xml
          if ! git diff --cached --quiet; then
            git commit -m "Add Ultra reasoning profile [skip ci]"
            git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Create local Google Services config
        run: |
          if [ ! -f app/google-services.json ]; then
            cat > app/google-services.json <<'EOF'
          {"project_info":{"project_number":"123456789000","project_id":"rikkahub-unlimited-local","storage_bucket":"rikkahub-unlimited-local.appspot.com"},"client":[{"client_info":{"mobilesdk_app_id":"1:123456789000:android:0000000000000000","android_client_info":{"package_name":"me.rerere.rikkahub.longagent"}},"oauth_client":[],"api_key":[{"current_key":"AIzaSyDUMMY000000000000000000000000000"}],"services":{"appinvite_service":{"other_platform_oauth_client":[]}}}],"configuration_version":"1"}
          EOF
          fi

      - name: Build debug APK
        id: build
        env:
          GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx4g
        run: |
          chmod +x gradlew
          set +e
          ./gradlew assembleDebug --stacktrace 2>&1 | tee gradle-build.log
          code=${PIPESTATUS[0]}
          set -e
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          { grep -E '(^e: |\.kt:[0-9]+:[0-9]+:|^error:)' gradle-build.log | tail -n 40 || true; tail -n 60 gradle-build.log; } > gradle-build-diagnosis.log

      - name: Persist bounded failure diagnosis
        if: steps.build.outputs.exit_code != '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp gradle-build-diagnosis.log .github/build-unlimited-agent-error.log
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/build-unlimited-agent-error.log
          if ! git diff --cached --quiet; then
            git commit -m "Record long-agent build failure [skip ci]"
            git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
          exit 1

      - name: Verify and upload APK
        run: test -n "$(find app/build/outputs/apk -type f -name '*.apk' -print -quit)"
      - uses: actions/upload-artifact@v4
        with:
          name: rikkahub-agent-long-running-standalone-debug
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish prerelease APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mapfile -t apks < <(find app/build/outputs/apk -type f -name '*.apk' | sort)
          tag="long-agent-ultra-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          gh release create "$tag" "${apks[@]}" --repo "$GITHUB_REPOSITORY" --target "$(git rev-parse HEAD)" --prerelease --title "RikkaHub Long Agent - Ultra standalone" --notes "Standalone package ID: me.rerere.rikkahub.longagent. Main-agent steps: Int.MAX_VALUE. Default wall-clock turn budget: 4 hours, max: 8 hours. Ultra reasoning: 64K token budget with safe xhigh effort fallback for OpenAI/Codex-compatible APIs. Manual cancellation, loop detection, and individual tool timeouts remain enabled. Debug-signed APK."