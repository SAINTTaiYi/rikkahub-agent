name: Build Long-Running Agent APK

on:
  push:
    branches: [build/unlimited-agent-steps]
    paths: [.github/workflows/build-unlimited-agent.yml]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: unlimited-agent-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: build/unlimited-agent-steps
          fetch-depth: 0
          persist-credentials: false

      - name: Remove call ceiling and extend turn budget
        run: |
          python3 - <<'PY'
          from pathlib import Path

          changes = [
              (
                  Path("app/src/main/java/me/rerere/rikkahub/service/ChatService.kt"),
                  "maxSteps = subAgentProfile?.generationMaxSteps() ?: 32,",
                  "maxSteps = subAgentProfile?.generationMaxSteps() ?: Int.MAX_VALUE,",
              ),
              (
                  Path("app/src/main/java/me/rerere/rikkahub/data/preferences/TermuxDefaults.kt"),
                  "const val DEFAULT_TURN_BUDGET_MS = 10L * 60L * 1_000L // 10 min",
                  "const val DEFAULT_TURN_BUDGET_MS = 4L * 60L * 60L * 1_000L // 4 h",
              ),
              (
                  Path("app/src/main/java/me/rerere/rikkahub/data/preferences/TermuxDefaults.kt"),
                  "const val MAX_TURN_BUDGET_MS = 60L * 60L * 1_000L // 60 min",
                  "const val MAX_TURN_BUDGET_MS = 8L * 60L * 60L * 1_000L // 8 h",
              ),
          ]
          for path, old, new in changes:
              text = path.read_text()
              if new in text and old not in text:
                  continue
              if text.count(old) != 1:
                  raise SystemExit(f"Refusing ambiguous patch in {path}: {old!r}")
              path.write_text(text.replace(old, new, 1))
          PY
          grep -F "maxSteps = subAgentProfile?.generationMaxSteps() ?: Int.MAX_VALUE," app/src/main/java/me/rerere/rikkahub/service/ChatService.kt
          grep -F "DEFAULT_TURN_BUDGET_MS = 4L * 60L * 60L * 1_000L" app/src/main/java/me/rerere/rikkahub/data/preferences/TermuxDefaults.kt
          grep -F "MAX_TURN_BUDGET_MS = 8L * 60L * 60L * 1_000L" app/src/main/java/me/rerere/rikkahub/data/preferences/TermuxDefaults.kt

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Create non-production Google Services config
        run: |
          if [ ! -f app/google-services.json ]; then
            python3 - <<'PY'
          import json, re
          from pathlib import Path
          gradle = Path("app/build.gradle.kts").read_text()
          match = re.search(r'applicationId\s*=\s*"([^"]+)"', gradle)
          package = match.group(1) if match else "me.rerere.rikkahub"
          data = {
            "project_info": {"project_number": "123456789000", "project_id": "rikkahub-unlimited-local", "storage_bucket": "rikkahub-unlimited-local.appspot.com"},
            "client": [{"client_info": {"mobilesdk_app_id": "1:123456789000:android:0000000000000000", "android_client_info": {"package_name": package}}, "oauth_client": [], "api_key": [{"current_key": "AIzaSyDUMMY000000000000000000000000000"}], "services": {"appinvite_service": {"other_platform_oauth_client": []}}}],
            "configuration_version": "1"
          }
          Path("app/google-services.json").write_text(json.dumps(data))
          PY
          fi

      - name: Build debug APK
        id: build
        env:
          GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx4g
        run: |
          chmod +x gradlew
          set +e
          ./gradlew assembleDebug --stacktrace 2>&1 | tee gradle-build.log
          code=${PIPESTATUS[0]}
          set -e
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          {
            grep -E '(^e: |^.*\.kt:[0-9]+:[0-9]+:|^error:)' gradle-build.log | tail -n 40 || true
            tail -n 60 gradle-build.log
          } > gradle-build-diagnosis.log

      - name: Persist bounded failure diagnosis
        if: steps.build.outputs.exit_code != '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp gradle-build-diagnosis.log .github/build-unlimited-agent-error.log
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/build-unlimited-agent-error.log
          git commit -m "Record long-agent build failure [skip ci]"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push origin "HEAD:${GITHUB_REF_NAME}"
          exit 1

      - name: Verify and upload APK
        run: test -n "$(find app/build/outputs/apk -type f -name '*.apk' -print -quit)"
      - uses: actions/upload-artifact@v4
        with:
          name: rikkahub-agent-long-running-debug
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Commit verified source patch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- app/src/main/java/me/rerere/rikkahub/service/ChatService.kt app/src/main/java/me/rerere/rikkahub/data/preferences/TermuxDefaults.kt; then
            echo "Verified source patch already committed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/me/rerere/rikkahub/service/ChatService.kt app/src/main/java/me/rerere/rikkahub/data/preferences/TermuxDefaults.kt
          git commit -m "Allow four-hour main-agent turns [skip ci]"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Publish prerelease APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mapfile -t apks < <(find app/build/outputs/apk -type f -name '*.apk' | sort)
          tag="long-agent-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          gh release create "$tag" "${apks[@]}" --repo "$GITHUB_REPOSITORY" --target "$(git rev-parse HEAD)" --prerelease --title "RikkaHub Agent - long-running turns" --notes "Main-agent steps: Int.MAX_VALUE. Default wall-clock turn budget: 4 hours. Configurable upper limit: 8 hours. Manual cancellation, loop detection, and individual tool timeouts remain enabled. Debug-signed APK."
