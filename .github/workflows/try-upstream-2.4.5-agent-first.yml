name: Try agent-first upstream 2.4.5 merge

on:
  push:
    branches:
      - integration/upstream-2.4.5-agent-first
    paths:
      - .github/workflows/try-upstream-2.4.5-agent-first.yml

permissions:
  contents: write

concurrency:
  group: upstream-2.4.5-agent-first
  cancel-in-progress: false

jobs:
  integrate-and-compile:
    runs-on: ubuntu-latest
    steps:
      - name: Check out trial branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: integration/upstream-2.4.5-agent-first

      - name: Merge 2.4.5 while preserving Agent conflict paths
        shell: bash
        run: |
          set -uo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add official https://github.com/rikkahub/rikkahub.git
          git fetch --no-tags official refs/tags/2.4.5:refs/tags/official-2.4.5

          upstream_sha="$(git rev-parse refs/tags/official-2.4.5^{commit})"
          if git merge-base --is-ancestor "$upstream_sha" HEAD; then
            echo "Official 2.4.5 is already integrated."
            exit 0
          fi

          git merge --no-ff -X ours "$upstream_sha" -m "merge: integrate RikkaHub 2.4.5 with Agent-first conflict policy"
          merge_status=$?

          if [ "$merge_status" -ne 0 ]; then
            git diff --name-only --diff-filter=U -z > /tmp/agent-first-conflicts.zlist
            resolution_status=0
            conflict_count=0

            while IFS= read -r -d '' file; do
              conflict_count=$((conflict_count + 1))
              echo "Restoring Agent path: $file"
              rm -rf -- "$file"

              if git cat-file -e "HEAD:$file" 2>/dev/null; then
                git checkout HEAD -- "$file" || resolution_status=1
                git add -A -- "$file" || resolution_status=1
              else
                # The Agent side deleted this path; do not git-add it again.
                git rm -r -f --ignore-unmatch -- "$file" || resolution_status=1
              fi
            done < /tmp/agent-first-conflicts.zlist

            remaining="$(git diff --name-only --diff-filter=U)"
            if [ "$resolution_status" -ne 0 ] || [ -n "$remaining" ]; then
              {
                echo "Agent-first path resolution failed"
                echo "Upstream commit: $upstream_sha"
                echo "Conflict paths processed: $conflict_count"
                echo
                echo "Remaining unmerged paths:"
                printf '%s\n' "$remaining"
                echo
                echo "Index conflict entries:"
                git ls-files -u
              } > /tmp/agent-first-resolution.txt

              git merge --abort
              cp /tmp/agent-first-resolution.txt .github/upstream-2.4.5-agent-first-resolution.txt
              git add .github/upstream-2.4.5-agent-first-resolution.txt
              git commit -m "ci: record agent-first path resolution diagnostics"
              git push origin HEAD:integration/upstream-2.4.5-agent-first
              exit 1
            fi
          fi

          # Keep fork CI unchanged; fork tokens may not push workflow modifications.
          rm -rf .github/workflows
          git checkout HEAD -- .github/workflows
          git add -A -- .github/workflows

          if git rev-parse -q --verify MERGE_HEAD >/dev/null; then
            git commit -m "merge: integrate RikkaHub 2.4.5 with Agent-first conflict policy"
            if [ "$?" -ne 0 ]; then
              git status --short > /tmp/agent-first-commit-status.txt
              git merge --abort
              cp /tmp/agent-first-commit-status.txt .github/upstream-2.4.5-agent-first-resolution.txt
              git add .github/upstream-2.4.5-agent-first-resolution.txt
              git commit -m "ci: record agent-first merge commit diagnostics"
              git push origin HEAD:integration/upstream-2.4.5-agent-first
              exit 1
            fi
          fi

          git push origin HEAD:integration/upstream-2.4.5-agent-first

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Compile and preserve diagnostics
        shell: bash
        run: |
          set +e
          chmod +x gradlew
          ./gradlew :app:compileDebugKotlin 2>&1 | tee /tmp/upstream-2.4.5-compile.log
          status=${PIPESTATUS[0]}
          set -e

          if [ "$status" -ne 0 ]; then
            {
              echo "Agent-first upstream 2.4.5 compile failure"
              echo "Branch commit: $(git rev-parse HEAD)"
              echo
              grep -E '^e: |^w: |FAILURE:|What went wrong|Compilation error' /tmp/upstream-2.4.5-compile.log | tail -n 300 || true
              echo
              echo "Last 120 build-log lines:"
              tail -n 120 /tmp/upstream-2.4.5-compile.log
            } > .github/upstream-2.4.5-agent-first-compile.txt
            git add .github/upstream-2.4.5-agent-first-compile.txt
            git commit -m "ci: record agent-first compile diagnostics"
            git push origin HEAD:integration/upstream-2.4.5-agent-first
            exit "$status"
          fi
