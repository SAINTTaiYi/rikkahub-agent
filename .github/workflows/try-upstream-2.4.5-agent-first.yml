name: Try agent-first upstream 2.4.5 merge

on:
  push:
    branches:
      - integration/upstream-2.4.5-agent-first
    paths:
      - .github/workflows/try-upstream-2.4.5-agent-first.yml

permissions:
  contents: write

concurrency:
  group: upstream-2.4.5-agent-first
  cancel-in-progress: false

jobs:
  integrate-and-compile:
    runs-on: ubuntu-latest
    steps:
      - name: Check out trial branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: integration/upstream-2.4.5-agent-first

      - name: Merge 2.4.5 while preserving Agent conflict hunks
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add official https://github.com/rikkahub/rikkahub.git
          git fetch --no-tags official refs/tags/2.4.5:refs/tags/official-2.4.5

          upstream_sha="$(git rev-parse refs/tags/official-2.4.5^{commit})"
          if git merge-base --is-ancestor "$upstream_sha" HEAD; then
            echo "Official 2.4.5 is already integrated."
            exit 0
          fi

          set +e
          git merge --no-ff -X ours "$upstream_sha" -m "merge: integrate RikkaHub 2.4.5 with Agent-first conflict policy"
          merge_status=$?
          set -e

          if [ "$merge_status" -ne 0 ]; then
            mapfile -t conflicts < <(git diff --name-only --diff-filter=U)
            printf 'Resolving %d residual file-state conflicts in favor of Agent\n' "${#conflicts[@]}"

            for file in "${conflicts[@]}"; do
              echo "Resolving: $file"
              if git cat-file -e ":2:$file" 2>/dev/null; then
                mkdir -p "$(dirname "$file")"
                git show ":2:$file" > "$file"
                git add -- "$file"
              else
                rm -rf -- "$file"
                git rm -f --ignore-unmatch -- "$file"
              fi
            done

            remaining="$(git diff --name-only --diff-filter=U)"
            if [ -n "$remaining" ]; then
              echo "::error::Unmerged paths remain:"
              printf '%s\n' "$remaining"
              exit 1
            fi
            git commit -m "merge: integrate RikkaHub 2.4.5 with Agent-first conflict policy"
          fi

          git push origin HEAD:integration/upstream-2.4.5-agent-first

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Compile and preserve diagnostics
        shell: bash
        run: |
          set +e
          chmod +x gradlew
          ./gradlew :app:compileDebugKotlin 2>&1 | tee /tmp/upstream-2.4.5-compile.log
          status=${PIPESTATUS[0]}
          set -e

          if [ "$status" -ne 0 ]; then
            {
              echo "Agent-first upstream 2.4.5 compile failure"
              echo "Branch commit: $(git rev-parse HEAD)"
              echo
              grep -E '^e: |^w: |FAILURE:|What went wrong|Compilation error' /tmp/upstream-2.4.5-compile.log | tail -n 300 || true
              echo
              echo "Last 120 build-log lines:"
              tail -n 120 /tmp/upstream-2.4.5-compile.log
            } > .github/upstream-2.4.5-agent-first-compile.txt
            git add .github/upstream-2.4.5-agent-first-compile.txt
            git commit -m "ci: record agent-first compile diagnostics"
            git push origin HEAD:integration/upstream-2.4.5-agent-first
            exit "$status"
          fi
