name: Release Ultra Standalone APK

on:
  push:
    branches: [build/unlimited-agent-steps]
    paths:
      - .github/workflows/release-ultra-standalone.yml
      - app/src/main/java/me/rerere/rikkahub/data/db/**
      - app/src/main/java/me/rerere/rikkahub/di/DataSourceModule.kt
      - app/src/test/java/me/rerere/rikkahub/data/db/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ultra-agent-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: build/unlimited-agent-steps
          fetch-depth: 0
          persist-credentials: false
          submodules: recursive

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Materialize Release signing identity
        env:
          KEY_BASE64: ${{ secrets.KEY_BASE64 }}
          SIGNING_CONFIG: ${{ secrets.SIGNING_CONFIG }}
        run: |
          test -n "$KEY_BASE64"
          test -n "$SIGNING_CONFIG"
          printf '%s' "$KEY_BASE64" | base64 --decode > app/rikkahub-ultra-release.p12
          printf '%s\n' "$SIGNING_CONFIG" > local.properties
          chmod 600 app/rikkahub-ultra-release.p12 local.properties

      - name: Create standalone Google Services config
        run: |
          if [ ! -f app/google-services.json ]; then
            cat > app/google-services.json <<'EOF'
          {"project_info":{"project_number":"123456789000","project_id":"rikkahub-unlimited-local","storage_bucket":"rikkahub-unlimited-local.appspot.com"},"client":[{"client_info":{"mobilesdk_app_id":"1:123456789000:android:0000000000000000","android_client_info":{"package_name":"me.rerere.rikkahub.longagent"}},"oauth_client":[],"api_key":[{"current_key":"AIzaSyDUMMY000000000000000000000000000"}],"services":{"appinvite_service":{"other_platform_oauth_client":[]}}}],"configuration_version":"1"}
          EOF
          fi

      - name: Build signed fast arm64 Release APK
        id: build
        env:
          GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx6g
        run: |
          chmod +x gradlew
          set +e
          ./gradlew :app:assembleRelease --parallel --build-cache --configuration-cache --max-workers=4 --stacktrace 2>&1 | tee gradle-build.log
          code=${PIPESTATUS[0]}
          set -e
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          { grep -E '(^e: |\.kt:[0-9]+:[0-9]+:|^error:)' gradle-build.log | tail -n 40 || true; tail -n 60 gradle-build.log; } > gradle-build-diagnosis.log

      - name: Upload bounded failure diagnosis
        if: steps.build.outputs.exit_code != '0'
        uses: actions/upload-artifact@v4
        with:
          name: rikkahub-ultra-arm64-build-diagnosis
          path: gradle-build-diagnosis.log
          if-no-files-found: error
          retention-days: 30

      - name: Stop after build failure
        if: steps.build.outputs.exit_code != '0'
        run: exit 1

      - name: Verify signed arm64 Release APK
        run: |
          mapfile -t apks < <(find app/build/outputs/apk -type f -name '*release*.apk' | sort)
          test "${#apks[@]}" -gt 0
          apksigner="$(find "${ANDROID_HOME}/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -n "$apksigner"
          for apk in "${apks[@]}"; do
            "$apksigner" verify --verbose --print-certs "$apk"
            mapfile -t abis < <(unzip -Z1 "$apk" | sed -n 's#^lib/\([^/]*\)/.*#\1#p' | sort -u)
            test "${#abis[@]}" -gt 0
            test "${abis[*]}" = "arm64-v8a"
          done
          rm -rf release-artifact
          mkdir -p release-artifact
          cp "${apks[@]}" release-artifact/
          (cd release-artifact && sha256sum *.apk > SHA256SUMS)

      - name: Remove temporary signing material
        if: always()
        run: rm -f app/rikkahub-ultra-release.p12 local.properties

      - uses: actions/upload-artifact@v4
        with:
          name: rikkahub-ultra-long-agent-arm64-signed-optimized-release
          path: release-artifact/
          if-no-files-found: error
          retention-days: 30
